<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light"><meta name="apple-mobile-web-app-capable" content="yes"><title>管理我的衣橱 · 衣序</title><link rel="stylesheet" href="/mobile.css"><script type="module" src="/mobile.js"></script></head><body data-page="manage"><header><a class="brand" href="/manage">衣序 <small>YIXU</small></a><a class="browse" href="/#outfits">浏览衣橱 ↗</a></header><main><div class="intro"><p class="eyebrow">一点点整理，每天都好穿</p><h1>我的衣橱</h1><p id="counts" class="muted">正在读取衣橱…</p></div><nav aria-label="管理功能"><button data-tab="items" aria-pressed="true">衣物</button><button data-tab="outfits" aria-pressed="false">搭配</button><button data-tab="backup" aria-pressed="false">备份</button></nav><p id="message" role="status" aria-live="polite"></p><section id="items"><div class="section-title"><h2>每件都值得被看见</h2><button id="add-item">＋ 添加衣物</button></div><label class="search-label">查找衣物<input id="search" type="search" placeholder="输入名称或编号"></label><div id="item-list" class="grid"></div></section><section id="outfits" hidden><div class="section-title"><h2>留下喜欢的组合</h2><button id="add-outfit">＋ 保存搭配</button></div><div id="outfit-list" class="grid"></div></section><section id="backup" hidden><article class="panel"><h2>给衣橱留一份副本</h2><p>完整备份包含数据库、已登记的原图与展示图片。下载后可在 iPhone「文件」中保存。</p><button id="download-backup">下载完整备份</button><p class="footnote">手机备份支持原始资料合计不超过 150 MB；更大的衣橱请使用服务器备份工具。备份不含登录密码，也不含未登记的临时文件。</p></article><article class="panel"><h2>从备份恢复</h2><p>先上传并校验，再查看衣物与搭配数量。确认后切换到恢复副本；当前衣橱会先自动完整备份，旧数据也会保留。</p><label>选择衣序备份<input id="restore-file" type="file" accept=".gz,application/gzip"></label><button id="preview-restore" class="secondary">上传并检查</button><div id="restore-preview" hidden><p id="restore-summary"></p><label>输入「恢复」确认切换<input id="restore-confirm" autocomplete="off"></label><button id="apply-restore" class="danger">确认恢复并切换</button></div></article><button id="logout" class="secondary">退出登录</button></section></main><footer>从已有的衣服，穿出新的自己。</footer><dialog id="editor"><form id="edit-form"><div class="section-title"><h2 id="editor-title">添加衣物</h2><button type="button" id="close-editor" class="icon" aria-label="关闭">×</button></div><div id="editor-fields"></div><div class="form-actions"><button type="submit" id="save-record">确认保存</button></div><p id="editor-message" role="status"></p></form></dialog></body></html>
